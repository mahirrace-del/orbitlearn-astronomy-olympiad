<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#071426" />
  <!-- Central star / planet -->
  <circle cx="32" cy="32" r="10" fill="#55D6E8" fill-opacity="0.2" stroke="#55D6E8" stroke-width="2.5" />
  <circle cx="32" cy="32" r="4.5" fill="#55D6E8" />
  <!-- Elliptical orbit -->
  <ellipse cx="32" cy="32" rx="22" ry="10" transform="rotate(-28 32 32)" stroke="#55D6E8" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.8" />
  <!-- Orbiting body -->
  <circle cx="48" cy="22" r="3.2" fill="#FFFFFF" />
</svg>
